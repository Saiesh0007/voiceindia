name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parser tests
        run: node --test tests/parser.test.mjs
      - name: Docker image builds and serves the app
        run: |
          docker compose up -d --build
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q "Bolo Khata"
          curl -fsI http://localhost:8080/js/app.js | grep -qi "javascript"
          docker compose down
